# Route chosen: GitHub Sponsors for the ORGANIZATION (openwave-labs), so sponsorship goes
# to the project rather than to a personal account. Uncomment the line below once the
# organization's Sponsors listing is approved (application + Stripe Connect payout account
# + tax form; docs.github.com/sponsors, "Setting up GitHub Sponsors for your organization").
# Publishing the handle before approval renders a dead button.

github: openwave-labs

